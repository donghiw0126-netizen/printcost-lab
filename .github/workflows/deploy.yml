# main 브랜치에 push 하면: 테스트 → (통과하면) GitHub Pages 에 배포
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: test # 테스트가 실패하면 배포하지 않습니다.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: 앱 파일만 모으기 (tests 폴더 등은 공개하지 않음)
        run: |
          mkdir _site
          cp index.html styles.css logic.js importer.js app.js icon.svg _site/
          # 캐시 갱신용 버전(커밋 번호 앞 7자리)
          sed -i "s#__VERSION__#${GITHUB_SHA::7}#g" _site/index.html
          if grep -q "__VERSION__" _site/index.html; then echo "치환되지 않은 값이 남아 있어요" && exit 1; fi
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
