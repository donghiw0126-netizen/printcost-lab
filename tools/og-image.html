<!doctype html>
<!-- 공유 미리보기 이미지(og-image.png, 1200×630) 원본.
     다시 만들기: Edge 로 이 파일을 1200×630 창 크기로 스크린샷
     "msedge --headless=new --window-size=1200,630 --screenshot=og-image.png tools/og-image.html" -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f6f4ef;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color: #1f2328;
    display: flex;
    padding: 64px 72px;
    gap: 56px;
    position: relative;
  }
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #e2672b; }
  .left { flex: 1.25; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 34px; letter-spacing: -0.5px; }
  .brand b { color: #e2672b; }
  .brand svg { width: 52px; height: 52px; }
  h1 { margin-top: 54px; font-size: 76px; line-height: 1.12; letter-spacing: -2.5px; font-weight: 800; }
  h1 em { font-style: normal; color: #e2672b; }
  .sub { margin-top: 22px; font-size: 30px; color: #6a6f76; letter-spacing: -0.5px; }
  .chips { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { border: 2px solid #e4e0d8; background: #fff; border-radius: 999px; padding: 10px 20px; font-size: 22px; font-weight: 600; }
  .card {
    flex: 1; align-self: center;
    background: #fff; border: 2px solid #e4e0d8; border-radius: 26px; padding: 34px 36px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.06);
  }
  .card h2 { font-size: 24px; color: #6a6f76; font-weight: 600; }
  .total { font-size: 74px; font-weight: 800; color: #e2672b; letter-spacing: -2px; margin-top: 4px; }
  .per { font-size: 24px; color: #6a6f76; margin-top: -2px; }
  .bar { display: flex; gap: 3px; height: 16px; margin: 20px 0 12px; border-radius: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .row { display: flex; justify-content: space-between; font-size: 23px; padding: 6px 0; border-bottom: 2px dashed #eee; }
  .row:last-child { border-bottom: 0; }
  .row span { display: flex; align-items: center; gap: 12px; }
  .row span::before { content: ""; width: 14px; height: 14px; border-radius: 4px; background: var(--c); }
  .row b { font-weight: 700; }
  .sale { margin-top: 18px; background: #fbe9df; color: #c4521c; border-radius: 14px; padding: 14px 18px; font-size: 24px; font-weight: 700; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e2672b"/><path d="M22 12h20v10l-6 8h-8l-6-8z" fill="#fff"/><path d="M30 30h4v6h-4z" fill="#fff"/><rect x="16" y="42" width="32" height="4" rx="2" fill="#fff" opacity=".95"/><rect x="19" y="47.5" width="26" height="4" rx="2" fill="#fff" opacity=".75"/><rect x="22" y="53" width="20" height="4" rx="2" fill="#fff" opacity=".55"/></svg>
      <span>PrintCost <b>Lab</b></span>
    </div>
    <h1>이거 뽑으면<br><em>얼마?</em></h1>
    <p class="sub">3D 프린팅 출력 비용 · 판매가 계산기</p>
    <div class="chips">
      <span>📂 G-code·3MF 자동 입력</span>
      <span>⚡ 기종별 소비전력</span>
      <span>🏷️ 판매가 계산</span>
    </div>
  </div>
  <div class="card">
    <h2>출력 비용 · 예시</h2>
    <div class="total">574원</div>
    <div class="per">한 판 2개 · 1개당 287원</div>
    <div class="bar"><i style="flex:79;background:#e2672b"></i><i style="flex:7;background:#e9b23a"></i><i style="flex:9;background:#7aa889"></i><i style="flex:5;background:#b6a99a"></i></div>
    <div class="row" style="--c:#e2672b"><span>필라멘트</span><b>490원</b></div>
    <div class="row" style="--c:#e9b23a"><span>전기료</span><b>24원</b></div>
    <div class="row" style="--c:#7aa889"><span>유지비</span><b>32원</b></div>
    <div class="row" style="--c:#b6a99a"><span>실패 대비 (5%)</span><b>28원</b></div>
    <div class="sale">→ 권장 판매가까지 한 번에</div>
  </div>
</body>
</html>
